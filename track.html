<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track your order | Weliza</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shop.css">
  <script src="construction.js"></script>
</head>
<body class="shop-body">
  <header class="sh-head"><a href="index.html"><img src="assets/logo/logo_word_emerald.png" alt="Weliza" class="sh-logo"></a>
    <div class="sh-nav"><a href="index.html">Back to shop</a></div></header>
  <main class="sh-main" style="max-width:620px">
    <h1 class="sh-title">Track your order</h1>
    <form id="tkForm" class="ck-card">
      <label>Order number<input id="tkNo" required placeholder="WL-1001"></label>
      <label>Phone number used for the order<input id="tkPh" required inputmode="tel" placeholder="10 digit mobile number"></label>
      <button class="sh-btn" type="submit">Track</button>
    </form>
    <div id="tkOut"></div>
  </main>
  <script>
    (function () {
      var API = 'https://gnvmqtoakysrhfetwnra.supabase.co/rest/v1/rpc/store_track_order';
      var KEY = 'sb_publishable__OycmvH5Og0XZ-jrco2o2A_BbZ_Usje';
      var $ = function (id) { return document.getElementById(id); };
      var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
      var money = function (n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); };
      var STEPS = [['new', 'Order placed'], ['confirmed', 'Confirmed'], ['packed', 'Packed'], ['shipped', 'Shipped'], ['delivered', 'Delivered']];
      var o = new URLSearchParams(location.search).get('o'); if (o) $('tkNo').value = o;
      $('tkForm').onsubmit = function (e) {
        e.preventDefault(); $('tkOut').innerHTML = '<p class="sh-msg">Checking…</p>';
        fetch(API, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_order_no: $('tkNo').value, p_phone: $('tkPh').value }) })
          .then(function (r) { return r.json(); }).then(function (d) {
            if (!d || !d.found) { $('tkOut').innerHTML = '<p class="ck-err">We could not find this order. Please check the order number and phone number.</p>'; return; }
            var idx = STEPS.map(function (s) { return s[0]; }).indexOf(d.order_status);
            var bar = d.order_status === 'cancelled' ? '<p class="ck-err">This order was cancelled.</p>' :
              '<div class="tk-steps">' + STEPS.map(function (s, i) { return '<div class="tk-step ' + (i <= idx ? 'on' : '') + '"><span></span>' + s[1] + '</div>'; }).join('') + '</div>';
            $('tkOut').innerHTML = '<div class="ck-card" style="margin-top:16px"><h2>Order ' + esc(d.order_no) + '</h2>' + bar +
              (d.courier || d.tracking_no ? '<p>Courier: <strong>' + esc(d.courier || '-') + '</strong><br>Tracking number: <strong>' + esc(d.tracking_no || '-') + '</strong></p>' : '') +
              d.items.map(function (i) { return '<div class="ck-line"><span>' + esc(i.name) + ' (' + esc(i.size) + (i.color ? ' / ' + esc(i.color) : '') + ') × ' + i.qty + '</span><span>' + money(i.line_total) + '</span></div>'; }).join('') +
              '<div class="ck-line ck-total"><span>Total' + (d.payment_method === 'cod' ? ' (pay on delivery)' : '') + '</span><span>' + money(d.total) + '</span></div></div>';
          }).catch(function () { $('tkOut').innerHTML = '<p class="ck-err">Something went wrong. Please try again.</p>'; });
      };
      if (o) $('tkPh').focus();
    })();
  </script>
</body>
</html>
